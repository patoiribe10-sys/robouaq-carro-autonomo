# Parámetros de transformación bird's eye view (perspectiva desde arriba)
# Cámara fisheye montada ~15cm sobre la pista, apuntando hacia abajo
# Ajustar src_points corriendo: python3 scripts/calibrate_fisheye.py --tune-birdseye

# Puntos en imagen original (trapecio visto desde arriba)
# Orden: [top-left, top-right, bottom-right, bottom-left]
# Imagen 640x480 — zona inferior donde se ven las líneas del carril
src_points:
  - [200, 200]   # top-left
  - [440, 200]   # top-right
  - [580, 420]   # bottom-right
  - [60,  420]   # bottom-left

# Puntos destino (rectángulo en imagen rectificada 400x400)
dst_points:
  - [50,  50]    # top-left
  - [350, 50]    # top-right
  - [350, 350]   # bottom-right
  - [50,  350]   # bottom-left

# Tamaño de la imagen de salida (bird's eye)
output_width: 400
output_height: 400

# ROI: usar solo el 60% inferior de la imagen antes del warp
roi_top_fraction: 0.4

# Parámetros de umbral HSV para detectar cinta oscura sobre vinilo claro
# Ajustar según condiciones de iluminación del track
hsv_dark_lower: [0, 0, 0]
hsv_dark_upper: [180, 255, 80]

# Filtros morfológicos
morph_kernel_size: 5
min_contour_area: 500

# Crosswalk: mínimo de líneas horizontales para considerar cruce peatonal
crosswalk_min_lines: 3
crosswalk_line_gap_px: 15
